<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ToolkitArchive Explorer</title>
<meta name="description" content="Search, filter and read every tool, model, free tier and benchmark in ToolkitArchive.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Mono&display=swap">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
:root{--bg:#f5f4f0;--card:#fff;--ink:#1c1d20;--mute:#686c74;--line:#e2e0da;--track:#ebe9e3;--acc:#b8562f;--acc2:#1f9d7a;--acc3:#3f7fe0;--warn:#c98a12;--bad:#c0392b;--code:#f0eee8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131417;--card:#1b1d21;--ink:#edece9;--mute:#9b9fa7;--line:#2c2f35;--track:#272a31;--code:#23262b}}
:root[data-theme="dark"]{--bg:#131417;--card:#1b1d21;--ink:#edece9;--mute:#9b9fa7;--line:#2c2f35;--track:#272a31;--code:#23262b}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans",system-ui,sans-serif}
a{color:var(--acc3)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.logo{font:600 18px "IBM Plex Serif",Georgia,serif;margin-right:auto;cursor:pointer}
.logo span{color:var(--acc)}
nav button,.chip,.btn{font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 13px;cursor:pointer}
nav button[aria-pressed=true],.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc3);outline-offset:2px}
main{max-width:1240px;margin:0 auto;padding:22px 16px 60px}
h1.hero{font:600 clamp(28px,5vw,46px)/1.1 "IBM Plex Serif",Georgia,serif;margin:8px 0 10px;letter-spacing:-.01em}
.lede{color:var(--mute);max-width:72ch;margin:0 0 18px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:120px}
.stat b{display:block;font-size:22px}
.stat small{color:var(--mute)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.go{cursor:pointer;transition:transform .12s,border-color .12s}
.go:hover{transform:translateY(-2px);border-color:var(--acc)}
.go h3{margin:0 0 4px;font-size:16px}
.go p{margin:0;color:var(--mute);font-size:13px}
.go .ic{font-size:22px}
h2.sec{font-size:15px;margin:26px 0 10px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.search{display:flex;gap:8px;margin:0 0 12px}
.search input{flex:1;font:inherit;font-size:16px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.meta{color:var(--mute);font-size:13px;margin:6px 0 12px}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr));gap:12px}
.res .card h4{margin:0 0 2px;font-size:15px}
.crumb{font-size:12px;color:var(--mute);margin:0 0 8px;cursor:pointer}
.crumb:hover{color:var(--acc)}
dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:3px 10px;font-size:13px}
dt{color:var(--mute)}dd{margin:0;overflow-wrap:anywhere}
.tags{margin-top:8px;display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line)}
.t-free{color:var(--acc2);border-color:var(--acc2)}.t-open{color:var(--acc3);border-color:var(--acc3)}.t-warn{color:var(--warn);border-color:var(--warn)}.t-bad{color:var(--bad);border-color:var(--bad)}.t-top{color:var(--acc);border-color:var(--acc)}
mark{background:#f3d27a66;color:inherit;border-radius:3px}
.reader{display:grid;grid-template-columns:230px 1fr;gap:22px}
.side{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow:auto;font-size:13px}
.side a{display:block;padding:3px 8px;border-radius:6px;color:var(--ink);text-decoration:none}
.side a:hover,.side a.on{background:var(--track)}
.side .sub{padding-left:18px;color:var(--mute)}
.doc{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 24px}
.doc h1{font:600 28px/1.2 "IBM Plex Serif",Georgia,serif}
.doc h2{border-bottom:1px solid var(--line);padding-bottom:4px;margin-top:30px}
.doc table{border-collapse:collapse;display:block;overflow-x:auto;font-size:13.5px;margin:10px 0}
.doc th,.doc td{border:1px solid var(--line);padding:6px 10px;vertical-align:top}
.doc th{background:var(--track);text-align:left}
.doc tr:nth-child(even) td{background:color-mix(in srgb,var(--track) 40%,transparent)}
.doc code{font-family:"IBM Plex Mono",monospace;background:var(--code);padding:1px 5px;border-radius:4px;font-size:.9em}
.doc pre{background:var(--code);padding:12px;border-radius:8px;overflow:auto}
.doc pre code{background:none;padding:0}
.doc img{max-width:100%}
.doc blockquote{margin:12px 0;padding:8px 14px;border-left:4px solid var(--line);color:var(--mute);background:color-mix(in srgb,var(--track) 50%,transparent);border-radius:0 8px 8px 0}
.doc blockquote.NOTE{border-color:var(--acc3)}.doc blockquote.TIP{border-color:var(--acc2)}.doc blockquote.IMPORTANT{border-color:#8b5cf6}.doc blockquote.WARNING{border-color:var(--warn)}.doc blockquote.CAUTION{border-color:var(--bad)}
.doc blockquote .alert{font-weight:600;display:block;margin-bottom:2px}
.doc details{border:1px solid var(--line);border-radius:8px;padding:6px 12px;margin:10px 0}
.doc summary{cursor:pointer;font-weight:600}
.tbl-filter{font:inherit;font-size:12px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);margin:8px 0 0;width:min(260px,100%)}
iframe.bench{width:100%;height:calc(100vh - 110px);border:1px solid var(--line);border-radius:10px;background:var(--card)}
.empty{color:var(--mute);padding:30px 0;text-align:center}
@media (max-width:820px){.reader{grid-template-columns:1fr}.side{position:static;max-height:none}.doc{padding:14px}}
@media (prefers-reduced-motion:reduce){.go{transition:none}}
</style>
</head>
<body>
<header><div class="bar">
<div class="logo" data-go="home">🧰 Toolkit<span>Archive</span></div>
<nav id="nav" aria-label="Sections">
<button data-v="home">Home</button><button data-v="explore">🔎 Explore</button><button data-v="read">📖 Read</button><button data-v="bench">📊 Benchmarks</button>
</nav>
<button class="btn" id="theme" aria-label="Toggle theme">◐</button>
</div></header>
<main id="app"><p class="empty">Loading the archive…</p></main>
<script>
const FILES=[
 ['README.md','🧰','Start here','Map, quick picks, what changed'],
 ['NEWS.md','📰','News','Sept 2026 releases, leaks, security alerts'],
 ['STUDENTS.md','🎓','Students / $0','Free alternative to everything'],
 ['FREE-ACCESS.md','🆓','Free AI access','No-card API tiers, free models, gateways'],
 ['CREDITS.md','💰','Credits & perks','Trial credits, student and startup programs, trust list'],
 ['MODELS.md','🧠','Models','Current lineup, prices, head-to-head verdict'],
 ['AGENTS.md','🤖','Agents & IDEs','CLI agents, IDEs, Terminal-Bench, MCP, frameworks'],
 ['SKILLS.md','⚡','Skills & MCP','Sept wave, directories, install in 60 seconds'],
 ['USAGE.md','🛠️','Use AI well','Chat app features, token efficiency'],
 ['MEDIA.md','🎬','Media','Free TTS, music, video, image; image/video leaderboards'],
 ['FRONTEND.md','🎨','Frontend','App builders, design-to-code, open-source builders'],
 ['BACKEND.md','🗄️','Backend','BaaS, databases, hosting, auth'],
 ['REFERENCES.md','📚','References','Runnable repos and source lists']
];
const TAGS=[
 ['free','Free',/\bfree\b|\$0\b|no card|no-card|zero registration/i,'t-free'],
 ['open','Open source',/open[- ]source|open[- ]weight|\bMIT\b|Apache|\bOSS\b|self-host/i,'t-open'],
 ['top','★ Top pick',/★/,'t-top'],
 ['student','Students',/student|\.edu|edu email/i,'t-free'],
 ['warn','⚠️ Caveat',/⚠️|unverified|caveat|rumou?r/i,'t-warn'],
 ['bad','⛔ Avoid',/⛔|scam|do not use|avoid/i,'t-bad']
];
const docs={},rows=[];let view='home',q='',fFile=null,fTags=new Set(),cur='README.md';
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug=h=>h.trim().toLowerCase().replace(/<[^>]+>/g,'').replace(/[^\p{L}\p{M}\p{N}\p{Pc} -]/gu,'').replace(/ /g,'-');
const plain=s=>s.replace(/\*\*|__|`/g,'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').trim();
function cells(line){return line.trim().replace(/^\||\|$/g,'').split(/(?<!\\)\|/).map(c=>c.replace(/\\\|/g,'|').trim())}
function parse(file,md){
  const L=md.split('\n');let h='',h2='';
  for(let i=0;i<L.length;i++){
    const m=L[i].match(/^(#{1,4})\s+(.*)/);if(m){if(m[1].length<=2)h2=m[2];h=m[2];continue}
    if(/^\s*\|/.test(L[i])&&L[i+1]&&/^\s*\|[\s:|-]+\|\s*$/.test(L[i+1])){
      const head=cells(L[i]);i+=2;
      while(i<L.length&&/^\s*\|/.test(L[i])){const c=cells(L[i]);rows.push({file,h,h2,head,c,txt:plain(c.join(' '))});i++}
      i--;
    }
  }
}
function tagsOf(t){return TAGS.filter(x=>x[2].test(t))}
function hl(s){if(!q)return s;const w=q.trim().split(/\s+/).filter(Boolean).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));if(!w.length)return s;return s.replace(new RegExp('('+w.join('|')+')(?![^<]*>)','gi'),'<mark>$1</mark>')}
const inl=s=>marked.parseInline(s||'');
function setView(v,opts={}){view=v;Object.assign(window,opts);render();window.scrollTo(0,0);
  const hash=v==='read'?'#read/'+cur+(opts.anchor?'#'+opts.anchor:''):'#'+v;if(location.hash!==hash)history.replaceState(null,'',hash)}
function render(){
  document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===view));
  ({home,explore,read,bench})[view]();
}
function home(){
  const n=Object.keys(docs).length,t=rows.length,fr=rows.filter(r=>TAGS[0][2].test(r.txt)).length,op=rows.filter(r=>TAGS[1][2].test(r.txt)).length;
  app.innerHTML=`<h1 class="hero">Every AI tool, model and freebie — searchable.</h1>
  <p class="lede">ToolkitArchive, re-checked 29 September 2026. Search across every table in the archive, filter to free or open-source, read any file with working links, or open the benchmark rankings.</p>
  <div class="search"><input id="hq" type="search" placeholder="Try: free claude, tts, deepseek, figma mcp, student…" aria-label="Search the archive"></div>
  <div class="stats"><div class="stat"><b>${t}</b><small>table rows indexed</small></div><div class="stat"><b>${fr}</b><small>mention free</small></div><div class="stat"><b>${op}</b><small>open source / weight</small></div><div class="stat"><b>${n}</b><small>files</small></div><div class="stat"><b>38</b><small>benchmark charts</small></div></div>
  <h2 class="sec">Start with</h2>
  <div class="cards">
   ${[['🎓','I spend $0','Free alternative to every paid tool','STUDENTS.md'],['🆓','Free AI keys','Free models and API tiers that work today','FREE-ACCESS.md'],['🏆','Which model is best?','Head-to-head across 34 benchmarks','#bench'],['🤖','Pick a coding agent','Claude Code, Codex, OpenCode, Cline…','AGENTS.md'],['⚡','Skills & MCPs','Design, browsing, memory — with install commands','SKILLS.md'],['📰','What changed','September releases, leaks, security alerts','NEWS.md']].map(c=>`<div class="card go" tabindex="0" data-open="${c[3]}"><div class="ic">${c[0]}</div><h3>${c[1]}</h3><p>${c[2]}</p></div>`).join('')}
  </div>
  <h2 class="sec">All files</h2>
  <div class="cards">${FILES.filter(f=>docs[f[0]]).map(f=>`<div class="card go" tabindex="0" data-open="${f[0]}"><div class="ic">${f[1]}</div><h3>${f[2]}</h3><p>${f[3]}</p></div>`).join('')}</div>`;
  $('#hq').addEventListener('keydown',e=>{if(e.key==='Enter'){q=e.target.value;setView('explore')}});
}
function explore(){
  app.innerHTML=`<div class="search"><input id="q" type="search" value="${esc(q)}" placeholder="Search every table…" aria-label="Search"></div>
  <div class="chips" id="tagchips">${TAGS.map(t=>`<button class="chip" data-tag="${t[0]}" aria-pressed="${fTags.has(t[0])}">${t[1]}</button>`).join('')}</div>
  <div class="chips" id="filechips"><button class="chip" data-file="" aria-pressed="${!fFile}">All files</button>${FILES.filter(f=>docs[f[0]]).map(f=>`<button class="chip" data-file="${f[0]}" aria-pressed="${fFile===f[0]}">${f[1]} ${f[2]}</button>`).join('')}</div>
  <div class="meta" id="meta"></div><div class="res" id="res"></div>`;
  const inp=$('#q');inp.focus();inp.setSelectionRange(q.length,q.length);
  inp.addEventListener('input',e=>{q=e.target.value;results()});
  results();
}
function results(){
  const w=q.toLowerCase().split(/\s+/).filter(Boolean);
  let r=rows.filter(x=>(!fFile||x.file===fFile)&&w.every(t=>(x.txt+' '+x.h).toLowerCase().includes(t))&&[...fTags].every(t=>TAGS.find(y=>y[0]===t)[2].test(x.txt)));
  const total=r.length;r=r.slice(0,300);
  $('#meta').textContent=`${total} match${total===1?'':'es'}${total>300?' — showing first 300, narrow your search':''}`;
  $('#res').innerHTML=r.map(x=>{
    const t=tagsOf(x.txt);
    return `<article class="card"><div class="crumb" data-open="${x.file}" data-anchor="${slug(x.h)}">${esc(x.file)} › ${esc(plain(x.h))}</div><h4>${hl(inl(x.c[0]))}</h4><dl>${x.c.slice(1).map((v,i)=>v&&v!=='—'?`<dt>${esc(plain(x.head[i+1]||''))}</dt><dd>${hl(inl(v))}</dd>`:'').join('')}</dl>${t.length?`<div class="tags">${t.map(y=>`<span class="tag ${y[3]}">${y[1]}</span>`).join('')}</div>`:''}</article>`}).join('')||'<p class="empty">Nothing found. Try fewer words.</p>';
}
function alerts(md){
  return md.replace(/^> \[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*\n((?:>.*\n?)*)/gm,(m,k,body)=>{
    const icon={NOTE:'ℹ️ Note',TIP:'💡 Tip',IMPORTANT:'❗ Important',WARNING:'⚠️ Warning',CAUTION:'⛔ Caution'}[k];
    return `<blockquote class="${k}"><span class="alert">${icon}</span>${marked.parse(body.replace(/^> ?/gm,''))}</blockquote>\n`;
  });
}
function read(){
  const md=docs[cur]||'';
  const toc=[...md.matchAll(/^(#{2,3})\s+(.*)$/gm)].map(m=>({l:m[1].length,t:plain(m[2]),id:slug(m[2])}));
  app.innerHTML=`<div class="reader"><aside class="side" aria-label="Files and sections">${FILES.filter(f=>docs[f[0]]).map(f=>`<a href="#read/${f[0]}" class="${f[0]===cur?'on':''}" data-open="${f[0]}">${f[1]} ${f[2]}</a>${f[0]===cur?toc.map(t=>`<a class="sub" href="#read/${cur}#${t.id}" data-open="${cur}" data-anchor="${t.id}">${esc(t.t)}</a>`).join(''):''}`).join('')}</aside><article class="doc" id="doc"></article></div>`;
  const doc=$('#doc');
  doc.innerHTML=marked.parse(alerts(md));
  doc.querySelectorAll('h1,h2,h3,h4').forEach(h=>h.id=slug(h.textContent));
  doc.querySelectorAll('img').forEach(i=>{const s=i.getAttribute('src');if(s&&s.startsWith('./'))i.src=s.slice(2)});
  doc.querySelectorAll('a[href]').forEach(a=>{
    const h=a.getAttribute('href');const m=h.match(/^(?:\.\/)?([\w.-]+\.md)(?:#(.*))?$/)||h.match(/^#(.+)$/)&&[null,cur,h.slice(1)];
    if(m&&docs[m[1]]){a.dataset.open=m[1];if(m[2])a.dataset.anchor=m[2];a.href='#read/'+m[1]+(m[2]?'#'+m[2]:'')}
    else if(/\.html$/.test(h)){a.href=h.replace(/^\.\//,'')}
    else if(/^https?:/.test(h)){a.target='_blank';a.rel='noopener'}
  });
  doc.querySelectorAll('table').forEach(t=>{
    if(t.rows.length<8)return;
    const f=document.createElement('input');f.className='tbl-filter';f.type='search';f.placeholder='Filter this table…';f.setAttribute('aria-label','Filter table');
    f.addEventListener('input',()=>{const v=f.value.toLowerCase();[...t.tBodies[0].rows].forEach(r=>r.hidden=v&&!r.textContent.toLowerCase().includes(v))});
    t.before(f);
    [...t.tHead.rows[0].cells].forEach((th,ci)=>{th.style.cursor='pointer';th.title='Sort';th.addEventListener('click',()=>{
      const b=t.tBodies[0],rs=[...b.rows],dir=th.dataset.dir==='a'?'d':'a';th.dataset.dir=dir;
      const val=r=>{const s=r.cells[ci]?.textContent.trim()||'';const n=parseFloat(s.replace(/[^\d.-]/g,''));return isNaN(n)?s.toLowerCase():n};
      rs.sort((x,y)=>{const a=val(x),c=val(y);return (a>c?1:a<c?-1:0)*(dir==='a'?1:-1)});rs.forEach(r=>b.appendChild(r))})});
  });
  if(window.anchor){const el=document.getElementById(window.anchor);window.anchor=null;if(el)setTimeout(()=>el.scrollIntoView(),0)}
  doc.querySelectorAll('code.language-mermaid').forEach(async c=>{
    if(!window.mermaid){await import('https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.esm.min.mjs').then(m=>{window.mermaid=m.default;mermaid.initialize({startOnLoad:false,theme:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'})})}
    const d=document.createElement('div');d.className='mermaid';d.textContent=c.textContent;c.parentElement.replaceWith(d);mermaid.run({nodes:[d]});
  });
}
function bench(){app.innerHTML=`<iframe class="bench" src="benchmarks.html" title="Benchmark rankings"></iframe><p class="meta"><a href="benchmarks.html">Open full screen</a></p>`}
document.addEventListener('click',e=>{
  const n=e.target.closest('[data-v]');if(n){setView(n.dataset.v);return}
  if(e.target.closest('[data-go="home"]')){setView('home');return}
  const o=e.target.closest('[data-open]');if(o){e.preventDefault();const f=o.dataset.open;if(f==='#bench'){setView('bench');return}cur=f;setView('read',{anchor:o.dataset.anchor||null});return}
  const t=e.target.closest('[data-tag]');if(t){const k=t.dataset.tag;fTags.has(k)?fTags.delete(k):fTags.add(k);explore();return}
  const fl=e.target.closest('[data-file]');if(fl){fFile=fl.dataset.file||null;explore();return}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.go'))e.target.click();if(e.key==='/'&&!e.target.matches('input')){e.preventDefault();setView('explore')}});
$('#theme').addEventListener('click',()=>{const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);r.dataset.theme=d?'light':'dark';try{localStorage.setItem('ta-theme',r.dataset.theme)}catch(_){}});
try{const t=localStorage.getItem('ta-theme');if(t)document.documentElement.dataset.theme=t}catch(_){}
function route(){const h=decodeURIComponent(location.hash.slice(1));if(h.startsWith('read/')){const [f,a]=h.slice(5).split('#');if(docs[f]){cur=f;view='read';window.anchor=a||null}}else if(['explore','bench','home'].includes(h))view=h;render()}
Promise.all(FILES.map(f=>fetch(f[0]).then(r=>r.ok?r.text():null).then(t=>{if(t){docs[f[0]]=t;parse(f[0],t)}}).catch(()=>{}))).then(()=>{
  if(!Object.keys(docs).length){app.innerHTML='<p class="empty">Couldn\'t load the markdown files. Open this page through GitHub Pages or a local server (python -m http.server), not from the file system.</p>';return}
  route();
});
window.addEventListener('hashchange',route);
</script>
</body>
</html>
